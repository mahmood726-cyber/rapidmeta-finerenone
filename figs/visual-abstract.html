<!doctype html><meta charset='utf-8'><style>html,body{margin:0;padding:0;background:#fff}svg{display:block}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" role="img" aria-label="Visual abstract: HR (horizontal) against no difference (vertical reference line), showing the pooled estimate and its confidence interval">
<rect x="1" y="1" width="898" height="418" fill="none" stroke="currentColor" stroke-opacity=".35" rx="8"/>
<text x="28" y="40" font-size="17" font-weight="700" fill="currentColor" opacity="1">Sacubitril/valsartan in adults with heart failure and reduced ejection</text>
<text x="28" y="64" font-size="17" font-weight="700" fill="currentColor" opacity="1">fraction</text>
<text x="28" y="98" font-size="13" font-weight="400" fill="currentColor" opacity=".85">In adults with heart failure and reduced ejection fraction, what is the hazard of a first</text>
<text x="28" y="116" font-size="13" font-weight="400" fill="currentColor" opacity=".85">cardiovascular death or heart failure hospitalization with sacubitril/valsartan compared</text>
<text x="28" y="134" font-size="13" font-weight="400" fill="currentColor" opacity=".85">with enalapril?</text>
<line x1="190" y1="226" x2="770" y2="226" stroke="currentColor" stroke-opacity=".35"/>
<line x1="480.0" y1="192" x2="480.0" y2="246" stroke="currentColor" stroke-width="1.5"/>
<text x="480.0" y="262" font-size="12" text-anchor="middle" fill="currentColor" opacity=".85">no difference</text>
<line x1="280.0" y1="212" x2="492.2" y2="212" stroke="#1d4ed8" stroke-width="3"/>
<line x1="280.0" y1="205" x2="280.0" y2="219" stroke="#1d4ed8" stroke-width="3"/>
<line x1="492.2" y1="205" x2="492.2" y2="219" stroke="#1d4ed8" stroke-width="3"/>
<rect x="380.1" y="206.0" width="12" height="12" fill="#1d4ed8"/>
<text x="24" y="216" font-size="15" font-weight="700" fill="currentColor">HR 0.872</text>
<text x="24" y="236" font-size="13" fill="currentColor" opacity=".85">95% CI 0.746 to 1.02</text>
<text x="28" y="292" font-size="15" font-weight="700" fill="currentColor" opacity="1">The interval INCLUDES no difference: this pooled estimate is compatible with no effect.</text>
<text x="28" y="320" font-size="13" font-weight="400" fill="currentColor" opacity=".9">4 trials, 9,734 participants. Outcome: Cardiovascular death or hospitalization for heart failure,</text>
<text x="28" y="338" font-size="13" font-weight="400" fill="currentColor" opacity=".9">whichever comes first, as a hazard ratio. GRADE certainty: low.</text>
<text x="28" y="362" font-size="12" font-weight="400" fill="currentColor" opacity=".8">Leave-one-out: 2 of 4 refits still exclude no difference; the estimate does not survive removal of the</text>
<text x="28" y="379" font-size="12" font-weight="400" fill="currentColor" opacity=".8">largest trial.</text>
</svg>
