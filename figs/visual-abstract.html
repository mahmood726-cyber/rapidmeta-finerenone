<!doctype html><meta charset='utf-8'><style>html,body{margin:0;padding:0;background:#fff}svg{display:block}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" role="img" aria-label="Visual abstract: HR (horizontal) against no difference (vertical reference line), showing the pooled estimate and its confidence interval">
<rect x="1" y="1" width="898" height="418" fill="none" stroke="currentColor" stroke-opacity=".35" rx="8"/>
<text x="28" y="40" font-size="17" font-weight="700" fill="currentColor" opacity="1">Sotagliflozin against placebo across its pivotal cardiovascular outcome</text>
<text x="28" y="64" font-size="17" font-weight="700" fill="currentColor" opacity="1">programme: three separate estimands, never merged -- two pooled within</text>
<text x="28" y="88" font-size="17" font-weight="700" fill="currentColor" opacity="1">themselves, one reported from a single trial</text>
<text x="28" y="122" font-size="13" font-weight="400" fill="currentColor" opacity=".85">In both phase 3 trials that supported sotagliflozin&#x27;s approval, what is the effect of</text>
<text x="28" y="140" font-size="13" font-weight="400" fill="currentColor" opacity=".85">sotagliflozin compared with placebo on cardiovascular death and worsening heart failure --</text>
<text x="28" y="158" font-size="13" font-weight="400" fill="currentColor" opacity=".85">counted as total events, counted as time to a first event, and on the three-component</text>
<text x="28" y="176" font-size="13" font-weight="400" fill="currentColor" opacity=".85">atherothrombotic endpoint -- with each of those questions answered separately?</text>
<line x1="190" y1="268" x2="770" y2="268" stroke="currentColor" stroke-opacity=".35"/>
<line x1="480.0" y1="234" x2="480.0" y2="288" stroke="currentColor" stroke-width="1.5"/>
<text x="480.0" y="304" font-size="12" text-anchor="middle" fill="currentColor" opacity=".85">no difference</text>
<line x1="280.0" y1="254" x2="397.6" y2="254" stroke="#1d4ed8" stroke-width="3"/>
<line x1="280.0" y1="247" x2="280.0" y2="261" stroke="#1d4ed8" stroke-width="3"/>
<line x1="397.6" y1="247" x2="397.6" y2="261" stroke="#1d4ed8" stroke-width="3"/>
<rect x="332.8" y="248.0" width="12" height="12" fill="#1d4ed8"/>
<text x="24" y="258" font-size="15" font-weight="700" fill="currentColor">HR 0.749</text>
<text x="24" y="278" font-size="13" fill="currentColor" opacity=".85">95% CI 0.664 to 0.845</text>
<text x="28" y="334" font-size="15" font-weight="700" fill="currentColor" opacity="1">The interval excludes no difference.</text>
<text x="28" y="362" font-size="13" font-weight="400" fill="currentColor" opacity=".9">2 trials, 11,806 participants. Outcome: Time to the FIRST occurrence of that same composite, as a hazard</text>
<text x="28" y="380" font-size="13" font-weight="400" fill="currentColor" opacity=".9">ratio. GRADE certainty: low.</text>
<text x="28" y="404" font-size="12" font-weight="400" fill="currentColor" opacity=".8">Leave-one-out: 2 of 2 refits still exclude no difference; the estimate does not survive removal of the</text>
<text x="28" y="421" font-size="12" font-weight="400" fill="currentColor" opacity=".8">largest trial.</text>
</svg>
