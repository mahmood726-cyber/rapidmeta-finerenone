name: pages

# Publishes the repository root to GitHub Pages via the Actions builder.
#
# WHY THIS REPLACES THE LEGACY BUILDER. The site is currently built by the legacy
# branch-based Pages builder (`build_type: "legacy"`, source `main` `/`), which is
# subject to a ~10 minute build timeout. This repo is 1,478 root HTML pages and
# ~1.1 GB, and a commit that rewrites several hundred of those pages has been
# observed to exceed that timeout. An Actions-built deploy runs under the normal
# job limit (hours, not minutes) and produces a log when it fails, which the legacy
# builder does not.
#
# THIS WORKFLOW DOES NOT SWITCH THE BUILDER. Changing Pages "Source" from
# "Deploy from a branch" to "GitHub Actions" is a repository settings change and
# has to be made by hand in Settings -> Pages. Until it is made, the `build` job
# below runs and validates the artifact, and only the `deploy` job fails. That is
# deliberate: the build is worth running and reading before the switch is made.
#
# `.nojekyll` is required and is asserted by the preflight -- without it the Pages
# runtime treats the tree as a Jekyll source and silently drops `_`-prefixed paths.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# `contents: read` to check out; `pages: write` + `id-token: write` are what
# deploy-pages needs to mint its OIDC token and publish.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight -- a cancelled deploy can
# leave the site serving a partially-swapped tree.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build artifact
    runs-on: ubuntu-latest
    # The legacy builder's ceiling was ~10 min. This is the whole point of the
    # migration: give the build room, but still bound it so a hang is visible.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The object store is ~2 GB. A shallow checkout is the difference
          # between a 30-second and a multi-minute clone; no history is needed
          # to publish a working tree.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pages caps a published site at 1 GB, and here that is a build FAILURE, not a
      # warning -- it is what commit f7cb32bdd was fixing. After that slim-down and the
      # corpus merge the tracked tree is still ~1.05 GB, so something must be pruned.
      #
      # WHAT CHANGED 2026-08-18, AND WHY ssot/ IS NO LONGER PRUNED WHOLESALE.
      # The old rule dropped all of ssot/ on the ground that "no served file references
      # it", checked by grepping every root .html and .js for href/src/fetch and for the
      # bare directory name. That check was correct and it was answering the wrong
      # question. EVERY REVIEW PAGE IN THIS CORPUS TELLS ITS READER, in prose, that its
      # numbers are "projected from a single canonical object" -- and that object was
      # returning 404. The claim is not a hyperlink, so a link grep could never see it.
      # The central transparency claim of the project was unverifiable by the reader it
      # was written for, and had been for weeks.
      #
      # THE COST IS 5.3 MB, NOT 90. Measured from the tracked tree at origin/main:
      # ssot/ is 90.5 MB across 365 files, but 85.2 MB of that is ssot/*/sources/ --
      # raw registry and publication captures, which are working material and which no
      # page promises. The canonical objects themselves are 3.0 MB across 49 files;
      # keeping everything except sources/ is 125 files and 5.26 MB.
      #
      #   prune retired + removed + all of ssot   856.5 MB   (the old rule)
      #   prune retired + removed + ssot sources  861.8 MB   (this rule, 138 MB headroom)
      #   prune retired + removed only            947.0 MB   (53 MB headroom -- too thin)
      #   prune nothing                          1052.3 MB   (OVER CAP, build fails)
      #
      # This prunes the RUNNER'S DISPOSABLE CHECKOUT. Nothing is untracked and nothing is
      # deleted from the repository; the pruned paths simply are not published.
      #
      # outputs/ and e156-submission/ are NOT pruned: 916 served pages fetch paths under
      # outputs/, and index.html links three files in e156-submission/.
      - name: Prune non-served directories from the artifact
        run: |
          rm -rf retired removed
          find ssot -mindepth 2 -maxdepth 2 -type d -name sources -exec rm -rf {} +
          echo "ssot/ retained: $(find ssot -type f | wc -l) files, $(du -sh ssot | cut -f1)"

      - name: Preflight (site shape + payload)
        run: python scripts/pages_preflight.py --root .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The repository root, exactly as the legacy builder published it.
          # The action tars this path with `--exclude=.git --exclude=.github`;
          # scripts/pages_preflight.py measures the same set, so the payload it
          # reports is the payload that is uploaded.
          path: .

  # ---------------------------------------------------------------------------
  # THE GATE SUITE, AS A PROPERTY OF THE DESTINATION RATHER THAN OF THE ROUTE.
  #
  # WHY THIS JOB EXISTS. On 2026-09-09 commit 049f0c923 reached Pages main and its own
  # message records how: "Deployed via git plumbing to Pages main." Plumbing does not run
  # .githooks/pre-push, so the executable-rule block never asked. The commit asserted
  # "47 gates 0 firing"; running gates/run_all.py on that exact tree returns FAIL, with
  # gate18 naming EMPAGLIFLOZIN_HF_AUTO_FULL_REVIEW.html for a pinned correction phrase
  # that is ABSENT, and gate16 failing at the same 147-of-1427 coverage it passes with
  # one commit earlier.
  #
  #     A HOOK ONLY THE POLITE PATH INVOKES IS NOT A GUARD.
  #     A DEPLOY ROUTE THAT SKIPS THE GATE MAKES EVERY GATE OPT-IN.
  #
  # executable-rule-gates.yml already runs this suite on every push to every branch. What
  # it did NOT do is stop the deploy: two independent workflows, and Pages published
  # regardless of the verdict. So the suite is bound to the deploy here. Any push to main,
  # however it was produced -- porcelain, plumbing, the API, the web editor -- must satisfy
  # it before an artefact is published, because the requirement now belongs to the
  # destination and not to the path taken to reach it.
  gates:
    name: gate suite must pass before anything is published
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gate 3 reads a pinned blob; a shallow clone cannot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every gate registered in run_all
        run: python gates/run_all.py
      - name: The gates can still fail
        run: python gates/verify_gates_can_fail.py

  deploy:
    name: deploy to Pages
    needs: [build, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
