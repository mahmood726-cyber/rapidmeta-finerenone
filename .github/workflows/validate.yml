name: Validate Living MA Portfolio

on:
  push:
    branches: [main]
    paths:
      - '*_REVIEW.html'
      - 'LivingMeta.html'
      - 'index.html'
      - 'e156-submission/**'
      - 'validate_living_ma_portfolio.py'
      - 'validate_pages_links.py'
      - 'generate_living_ma_v13.py'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 to diff changed review apps

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # NOTE: this is a BENCHMARK-REGRESSION gate, not portfolio-wide validation.
      # --strict checks that every externally-benchmarked app (~17 of ~1518) still
      # pools k>=2 trials AND matches its published reference within 10% with the
      # benchmark inside the pooled CI. The other ~1500 apps have no external
      # reference and are reported as UNVALIDATED. --require-coverage 1.0 floors
      # the benchmarked set so a regression that deletes benchmarks can't make the
      # gate trivially pass. Portfolio-wide k>=2 enforcement (--gate-strict) is
      # intentionally NOT used here: the portfolio keeps single-trial evidence
      # cards by design, so that gate would fail on hundreds of by-design apps.
      - name: Benchmark-regression gate (k>=2 + CI, ~17 benchmarked apps)
        run: |
          python validate_living_ma_portfolio.py --local --strict --require-coverage 1.0

      - name: Validate generator script (no errors)
        run: |
          python -c "
          import ast
          with open('generate_living_ma_v13.py') as f:
              ast.parse(f.read())
          print('generate_living_ma_v13.py: syntax OK')
          "

      # Wire the real inline-JS checker into CI (previously unwired). A full-corpus
      # run spawns `node --check` per <script> block across ~1500 apps and is too
      # slow for CI, so gate the review apps CHANGED in this push/PR. _js_parse_gate
      # fails closed: zero matched files or an unparseable realData block -> non-zero.
      - name: JS parse gate on changed review apps
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- '*_REVIEW.html' 'LivingMeta.html' || true)
          if [ -z "$CHANGED" ]; then echo "No review apps changed — skipping JS parse gate."; exit 0; fi
          echo "Gating changed review apps:"; echo "$CHANGED"
          python scripts/_js_parse_gate.py $CHANGED

      - name: Validate published Pages links
        run: |
          python validate_pages_links.py

      - name: Check div balance on all apps
        run: |
          python -c "
          import re, os, sys
          fail = 0
          for f in sorted(os.listdir('.')):
              if not (f.endswith('_REVIEW.html') or f == 'LivingMeta.html'):
                  continue
              c = open(f, encoding='utf-8').read()
              o = len(re.findall(r'<div[\s>]', c))
              cl = c.count('</div>')
              if abs(o - cl) > 2:
                  print(f'FAIL {f}: {o}/{cl}')
                  fail += 1
              else:
                  print(f'OK   {f}: {o}/{cl}')
          if fail:
              sys.exit(1)
          "
