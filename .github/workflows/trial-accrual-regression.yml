name: Trial accrual regression

on:
  pull_request:
    paths:
      - '.github/workflows/trial-accrual.yml'
      - '.github/workflows/trial-accrual-regression.yml'
      - 'scripts/workflow/check_trial_status.py'
      - 'tests/test_trial_accrual.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/trial-accrual.yml'
      - '.github/workflows/trial-accrual-regression.yml'
      - 'scripts/workflow/check_trial_status.py'
      - 'tests/test_trial_accrual.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: First-baseline and CT.gov status regression checks
        run: python -m unittest discover -s tests -p 'test_trial_accrual.py' -v
