name: executable-rule-gates

# The full set, including the three page-reading gates the pre-push hook skips for time,
# plus the meta-gate that plants a defect in each and asserts it still fails.
#
# WHY THE META-GATE IS IN CI AND NOT ONLY IN A COMMIT MESSAGE. Every gate here PASSES on the
# corpus, because its pre-existing findings are frozen by name. That is exactly the state in
# which a broken gate is invisible: green, installed, seeing nothing. verify_gates_can_fail
# plants a defect in each one and asserts it fails, then asserts it recovers.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gate 3 reads a pinned blob; a shallow clone cannot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NAMED BY WHAT IT RUNS, NOT BY A COUNT THAT GOES STALE. The step said "All nine
      # gates" while run_all.py registered twelve. Nothing was skipped -- the step runs
      # the whole registry -- but a label that misstates its own scope is how a scoped
      # pass gets read as a complete one, and this repository has been bitten by exactly
      # that ("53 apps" that were 1,522).
      - name: Every gate registered in run_all
        run: python gates/run_all.py

      - name: The gates can still fail
        run: python gates/verify_gates_can_fail.py

      # NAMED HERE **IN ADDITION TO** gates/WIRED_REPO_CHECKS.json, SO IT RUNS TWICE.
      # The duplication is deliberate and is the cheaper of two wrongs.
      #
      # gate8 decides "has a caller" by reading the TEXT of the hooks and workflows
      # (CALLER_SOURCES). run_repo_checks.py executes the JSON registry, so a script
      # registered there is genuinely invoked on every push and gate8 still cannot see
      # it: 24 of the 26 registered checks are ALSO sitting in UNCALLED_REPO_GATES.json.
      # REGISTERING IS NOT WIRING.
      #
      # The elegant fix is to add gates/WIRED_REPO_CHECKS.json to gate8's CALLER_SOURCES,
      # and gate8's own comment already names the inconsistency -- "ARM A READS THIS LIST;
      # ARM B READS EVERY FILE IN .github/workflows/. That is an inconsistency inside one
      # gate rather than a policy." IT IS DECLINED HERE ANYWAY: that change makes gate8
      # see more callers, flag fewer gates and pass more easily, and A CHANGE THAT MAKES
      # A CHECKER LAXER CANNOT BE SELF-AUTHORISED BY THE LANE THE CHECKER IS CURRENTLY
      # BLOCKING. Logged for gate8's owner.
      #
      # Adding this script to UNCALLED_REPO_GATES.json would also have turned the gate
      # green -- by filing the finding into a 160-entry debt register. That is the move
      # this gate exists to prevent.
      - name: Contributing-trials rows equal k
        run: python scripts/gate_contributing_rows_equal_k.py

      # TREE-SCOPED, SO IT RUNS HERE AND NOT IN A PER-LANE HOOK. It walks every tracked
      # .py to answer "is this check invoked, by what, can it fail" -- and it judges THE
      # TREE, which is main property, not any one lane diff. Measured on the hook-wired
      # set: 23 TREE, 4 BOTH, exactly 1 DIFF. A tree-scanning check in a pre-push hook
      # makes the most up-to-date lane answerable for every other lane tree and exempts
      # the most stale one; six separate blocks in one night traced to that placement.
      # A measured comparison: one unbounded tree walk cost 47.8 CPU-s and 100% of a
      # push wall-clock, and slowed every concurrent lane 12x while it ran.
      #
      # gate8 flagged this file as "a gate written and left inert". The finding is TRUE --
      # a non-zero exit is structurally reachable and nothing called it -- but the label is
      # wrong: main() and report() always return 0, and the only non-zero paths are
      # --selftest and a fail-closed guard. It is a REPORT, not a gate. Answering the
      # finding rather than the label means giving it a real caller in the right place,
      # not wiring a 4-minute tree walk into every lane push to silence a gate.
      - name: Check liveness -- is it invoked, by what, can it fail
        run: |
          python scripts/audit_check_liveness.py --selftest
          python scripts/audit_check_liveness.py
