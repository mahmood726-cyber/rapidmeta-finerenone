name: Data integrity regression

on:
  pull_request:
    paths:
      - 'scripts/data_integrity_audit.py'
      - 'tests/test_data_integrity.py'
      - '.github/workflows/data-integrity-regression.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/data_integrity_audit.py'
      - 'tests/test_data_integrity.py'
      - '.github/workflows/data-integrity-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Recheck fixture detection and portfolio hard-zero integrity
        run: python -m pytest -q tests/test_data_integrity.py
